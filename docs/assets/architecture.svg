          <text x="10" y="51" class="mono-body" font-size="9.5px">2. Asserts reconstructed byte array == Ed25519 precompile message byte-for-byte</text>
          <text x="10" y="66" class="mono-body" font-size="9.5px">3. Sequential gating: <tspan class="mono-code" font-size="9.5px">milestone_idx == vault.current_tranche</tspan> &amp; <tspan class="mono-code" font-size="9.5px">status == 0</tspan></text>
