  <path d="M 1172 28 L 1184 28 M 1172 12 L 1172 24" class="datum-mark" />
  <path d="M 12 672 L 24 672 M 28 676 L 28 688" class="datum-mark" />
  <path d="M 1172 672 L 1184 672 M 1172 676 L 1172 688" class="datum-mark" />

  <!-- ============================================================ -->
  <!-- HEADER SPECIFICATION BLOCK                                   -->
  <!-- ============================================================ -->
  <g transform="translate(48, 38)">
    <text x="0" y="14" class="sub-kicker">TRANCHELOCK PROTOCOL ARCHITECTURE // FORMAL VERIFICATION &amp; SETTLEMENT SPEC</text>
    <text x="0" y="38" class="headline">Non-Custodial Tranche Escrow &amp; Ed25519 Instruction Introspection</text>
    <text x="730" y="38" class="spec-meta">CANONICAL 153-BYTE ATTESTATION · DEVNET LIVE · REPLAY-PROTECTED</text>
    <line x1="0" y1="52" x2="1104" y2="52" class="divider-solid" />
  </g>

  <!-- ============================================================ -->
  <!-- BOUNDARY 1: OFF-CHAIN VERIFICATION BOUNDARY                  -->
  <!-- ============================================================ -->
  <g transform="translate(48, 104)">
    <!-- Boundary Rail Label -->
    <rect x="0" y="0" width="1104" height="20" fill="#f2f2ee" rx="2" />
    <text x="12" y="14" class="boundary-label">01 // OFF-CHAIN VERIFICATION BOUNDARY (HOST-ISOLATED ENVIRONMENT)</text>
    <line x1="600" y1="10" x2="1090" y2="10" class="divider" />

    <!-- BOX 1: SPONSOR DEPOSIT AND COMMITMENT (Left) -->
    <g transform="translate(0, 30)">
