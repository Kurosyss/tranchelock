        <!-- Field 3 -->
        <rect x="0" y="51" width="190" height="15" fill="#242421" stroke="#383834" stroke-width="0.75" />
        <text x="6" y="62" class="mono-code-dark" font-size="9px">[65..97] submission_hash</text>
        <rect x="195" y="51" width="129" height="15" fill="#242421" stroke="#383834" stroke-width="0.75" />
        <text x="201" y="62" class="mono-sub-dark" font-size="9px">32B · SHA-256</text>

        <!-- Field 4 -->
        <rect x="0" y="68" width="190" height="15" fill="#242421" stroke="#383834" stroke-width="0.75" />
        <text x="6" y="79" class="mono-code-dark" font-size="9px">[97..129] milestone_spec_hash</text>
        <rect x="195" y="68" width="129" height="15" fill="#242421" stroke="#383834" stroke-width="0.75" />
        <text x="201" y="79" class="mono-sub-dark" font-size="9px">32B · SHA-256</text>

        <!-- Field 5..7 -->
        <rect x="0" y="85" width="190" height="15" fill="#242421" stroke="#383834" stroke-width="0.75" />
        <text x="6" y="96" class="mono-code-dark" font-size="9px">[129..153] amount+expiry+nonce</text>
