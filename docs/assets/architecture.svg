<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <style><![CDATA[
      .bg { fill: #fbfbfa; }
      .outer-frame { stroke: #e3e3df; stroke-width: 1.5; fill: none; }
      .divider { stroke: #ebebeb; stroke-width: 1; stroke-dasharray: 4 4; }
      .divider-solid { stroke: #e3e3df; stroke-width: 1; }
      .datum-mark { stroke: #999990; stroke-width: 1; fill: none; }

      /* Typography */
      .sub-kicker { font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; fill: #787873; letter-spacing: 0.16em; }
      .headline { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; font-size: 20px; font-weight: 600; fill: #171717; letter-spacing: -0.03em; }
      .spec-meta { font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; font-size: 9.5px; font-weight: 500; fill: #787873; letter-spacing: 0.08em; }

      /* Boundary Banners */
      .boundary-label { font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; font-size: 9px; font-weight: 700; fill: #52524e; letter-spacing: 0.18em; }

      /* Technical Panels */
      .plate-card { fill: #ffffff; stroke: #e3e3df; stroke-width: 1; }
      .plate-dark { fill: #141412; stroke: #2a2a26; stroke-width: 1; }
      .plate-steel { fill: #1c1c1a; stroke: #33332e; stroke-width: 1; }
      .plate-header { font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #171717; letter-spacing: 0.08em; }
      .plate-header-dark { font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 700; fill: #fbfbfa; letter-spacing: 0.08em; }
      .tag-num { font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; font-size: 9px; font-weight: 700; fill: #999990; }
      .tag-num-dark { font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; font-size: 9px; font-weight: 700; fill: #787873; }

      /* Monospace Details */
      .mono-body { font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #4a4a45; }
      .mono-code { font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; font-size: 10.5px; fill: #171717; font-weight: 600; }
      .mono-sub { font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; font-size: 9.5px; fill: #787873; }
      .mono-dim { font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; font-size: 9px; fill: #999990; }

      .mono-body-dark { font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #c4c4be; }
      .mono-code-dark { font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; font-size: 10.5px; fill: #ffffff; font-weight: 600; }
      .mono-sub-dark { font-family: 'SF Mono', Menlo, Monaco, Consolas, monospace; font-size: 9.5px; fill: #8a8a82; }

      /* Emerald Accent System */
      .emerald-text { fill: #10b981; font-weight: 600; }
      .emerald-stroke { stroke: #10b981; stroke-width: 1.5; fill: none; }
      .emerald-fill { fill: #10b981; }

      /* Connectors and Markers */
      .vector-line { stroke: #171717; stroke-width: 1.2; fill: none; }
      .vector-line-dashed { stroke: #787873; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
      .vector-line-emerald { stroke: #10b981; stroke-width: 1.4; fill: none; }
    ]]></style>

    <marker id="dot-dark" markerWidth="6" markerHeight="6" refX="3" refY="3">
      <circle cx="3" cy="3" r="2" fill="#171717" />
    </marker>
    <marker id="arrow-dark" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 1, 6 3.5, 0 6" fill="#171717" />
    </marker>
    <marker id="arrow-emerald" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <polygon points="0 1, 6 3.5, 0 6" fill="#10b981" />
