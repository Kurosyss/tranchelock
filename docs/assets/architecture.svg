        <text x="10" y="16" class="mono-code-dark" font-size="10px">[Ix 0] Ed25519Program Precompile</text>
        <text x="10" y="32" class="mono-sub-dark" font-size="9.5px">• Native Solana runtime cryptographic validation</text>
        <text x="10" y="47" class="mono-sub-dark" font-size="9.5px">• Signature checked: Ed25519(oracle, 153B, sig)</text>
        <text x="10" y="60" class="mono-code-dark" font-size="9px" fill="#10b981">✓ ZERO COMPUTE OVERHEAD IN BPF</text>

        <!-- Instruction 1 box -->
