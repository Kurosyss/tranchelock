      <path d="M 0 0 L 250 0 L 250 26 L 0 26 Z" fill="#fafaf8" stroke="#e3e3df" stroke-width="1" />
      <text x="12" y="18" class="plate-header">SPONSOR COMMITMENT</text>
      <text x="220" y="18" class="tag-num">01.A</text>

      <text x="12" y="48" class="mono-code">initialize_vault</text>
      <text x="12" y="66" class="mono-body">• Deposits $100 TLUSD in Vault PDA</text>
      <text x="12" y="84" class="mono-body">• Sets immutable expiry timestamp</text>
      <text x="12" y="106" class="mono-sub">ONCHAIN SPEC COMMITMENTS:</text>
