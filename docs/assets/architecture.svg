        <text x="340" y="47" class="mono-sub-dark" font-size="9.5px">• Asserts preceding ix is Ed25519Program</text>
        <text x="340" y="60" class="mono-code-dark" font-size="9px" fill="#10b981">✓ STRICT INSTRUCTION ADJACENCY</text>

