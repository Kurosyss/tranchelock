<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <style>
      .bg { fill: #fafafa; }
      .border { stroke: #ebebeb; stroke-width: 1.5; fill: none; }
      .eyebrow { font-family: "Geist Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; fill: #8f8f8f; letter-spacing: 0.12em; }
      .wordmark { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; font-size: 58px; font-weight: 700; fill: #171717; letter-spacing: -0.05em; }
      .proposition { font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; font-size: 19px; font-weight: 400; fill: #4d4d4d; letter-spacing: -0.015em; }
      .pill-bg { fill: #ffffff; stroke: #ebebeb; stroke-width: 1; rx: 6px; }
      .pill-text { font-family: "Geist Mono", "SF Mono", Menlo, Consolas, monospace; font-size: 11px; font-weight: 600; fill: #171717; letter-spacing: 0.04em; }
      .dot-green { fill: #10b981; }
      .dot-neutral { fill: #8f8f8f; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="360" class="bg" />

  <!-- Outer Hairline Frame -->
  <rect x="16" y="16" width="1168" height="328" rx="12" class="border" />

  <!-- Main Hero Lockup -->
  <g transform="translate(80, 88)">
    <!-- Prominent Approved Brand Mark (Squircle 104x104) -->
    <g transform="translate(0, 8)">
      <!-- Dark Squircle Badge -->
      <rect x="0" y="0" width="104" height="104" rx="24" fill="#0f0f0f" />
      <!-- Outer Rounded Squircle Frame -->
      <rect x="19" y="19" width="66" height="66" rx="11" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linejoin="round" />
      <!-- Horizontal Vault Rail / Crossbar -->
      <line x1="19" y1="39" x2="85" y2="39" stroke="#ffffff" stroke-width="7.5" stroke-linecap="square" />
      <!-- Downward Lock Chevron / Center Wedge -->
      <polyline points="26,47 52,64 78,47" fill="none" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Brand Typography & Proposition (Right of Mark) -->
    <g transform="translate(144, 0)">
      <!-- Eyebrow -->
      <text x="0" y="8" class="eyebrow">AUTONOMOUS CAPITAL PROTOCOL // SOLANA</text>

      <!-- Wordmark -->
      <text x="0" y="60" class="wordmark">TRANCHELOCK</text>

      <!-- Proposition -->
      <text x="0" y="98" class="proposition">Non-custodial milestone vaults with cryptographically enforced tranche release.</text>

      <!-- Technical Pills -->
      <g transform="translate(0, 126)">
        <!-- Pill 1: Solana Devnet -->
        <g transform="translate(0, 0)">
          <rect width="144" height="28" class="pill-bg" />
          <circle cx="14" cy="14" r="3.5" class="dot-green" />
          <text x="26" y="18" class="pill-text">SOLANA DEVNET</text>
        </g>

        <!-- Pill 2: 153-Byte Ed25519 -->
        <g transform="translate(154, 0)">
          <rect width="206" height="28" class="pill-bg" />
          <circle cx="14" cy="14" r="3.5" class="dot-neutral" />
          <text x="26" y="18" class="pill-text">153-BYTE ATTESTATION</text>
        </g>

        <!-- Pill 3: 22 Invariant Tests -->
        <g transform="translate(370, 0)">
          <rect width="186" height="28" class="pill-bg" />
          <circle cx="14" cy="14" r="3.5" class="dot-green" />
          <text x="26" y="18" class="pill-text">22 INVARIANT TESTS</text>
        </g>

        <!-- Pill 4: Anchor Protocol -->
        <g transform="translate(566, 0)">
          <rect width="148" height="28" class="pill-bg" />
          <circle cx="14" cy="14" r="3.5" class="dot-neutral" />
          <text x="26" y="18" class="pill-text">ANCHOR PROGRAM</text>
        </g>
      </g>
    </g>
  </g>
</svg>
