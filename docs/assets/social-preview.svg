<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      .bg { fill: #fafafa; }
      .border { stroke: #ebebeb; stroke-width: 1.5; fill: none; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; font-size: 64px; font-weight: 700; fill: #171717; letter-spacing: -0.04em; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; font-size: 26px; font-weight: 400; fill: #4d4d4d; letter-spacing: -0.01em; }
      .tagline { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; font-size: 18px; font-weight: 400; fill: #8f8f8f; }
      .badge-bg { fill: #ffffff; stroke: #ebebeb; stroke-width: 1; rx: 8px; }
      .badge-text { font-family: "SF Mono", Menlo, Monaco, Consolas, monospace; font-size: 14px; font-weight: 600; fill: #171717; letter-spacing: 0.04em; }
      .badge-dot { fill: #10b981; }
      .badge-blue { fill: #0070f3; }
      .hero-mesh { opacity: 0.15; }
    </style>
    <radialGradient id="ogMesh" cx="25%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#50e3c2" />
      <stop offset="35%" stop-color="#007cf0" />
      <stop offset="70%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#eb367f" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" class="bg" />
  
  <!-- Subtle ambient bloom -->
  <circle cx="280" cy="300" r="340" fill="url(#ogMesh)" class="hero-mesh" />

  <!-- Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="16" class="border" />

  <!-- Brand Mark (Large) -->
  <g transform="translate(96, 120)">
    <rect x="0" y="0" width="140" height="140" rx="32" fill="#0f0f0f" />
    <rect x="26" y="26" width="88" height="88" rx="16" fill="none" stroke="#ffffff" stroke-width="10" stroke-linejoin="round" />
    <line x1="26" y1="54" x2="114" y2="54" stroke="#ffffff" stroke-width="10" stroke-linecap="square" />
    <polyline points="35,64 70,86 105,64" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Wordmark and Description -->
  <g transform="translate(96, 320)">
    <text x="0" y="0" class="title">TRANCHELOCK</text>
    <text x="0" y="52" class="subtitle">Milestone-Gated Capital Release for Autonomous AI Agents</text>
    <text x="0" y="96" class="tagline">Solana Escrow Program · Ed25519 Instruction Introspection · Sandboxed Test Oracle</text>
  </g>

  <!-- Technical Verification Badges -->
  <g transform="translate(96, 480)">
    <!-- Badge 1: Devnet Live -->
    <g transform="translate(0, 0)">
      <rect width="190" height="38" class="badge-bg" />
      <circle cx="20" cy="19" r="5" class="badge-dot" />
      <text x="36" y="24" class="badge-text">SOLANA DEVNET</text>
    </g>
    <!-- Badge 2: 22 Invariants -->
    <g transform="translate(208, 0)">
      <rect width="250" height="38" class="badge-bg" />
      <circle cx="20" cy="19" r="5" class="badge-dot" />
      <text x="36" y="24" class="badge-text">22/22 INVARIANTS PASS</text>
    </g>
    <!-- Badge 3: Ed25519 Introspection -->
    <g transform="translate(476, 0)">
      <rect width="280" height="38" class="badge-bg" />
      <circle cx="20" cy="19" r="5" class="badge-blue" />
      <text x="36" y="24" class="badge-text">ED25519 INTROSPECTION</text>
    </g>
  </g>
</svg>
