<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <style>
      .bg { fill: #fafafa; }
      .border { stroke: #ebebeb; stroke-width: 1.5; fill: none; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; font-size: 46px; font-weight: 700; fill: #171717; letter-spacing: -0.04em; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; font-size: 19px; font-weight: 400; fill: #4d4d4d; letter-spacing: -0.01em; }
      .badge-bg { fill: #ffffff; stroke: #ebebeb; stroke-width: 1; rx: 6px; }
      .badge-text { font-family: "SF Mono", Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 600; fill: #171717; letter-spacing: 0.04em; }
      .badge-dot { fill: #10b981; }
      .badge-blue { fill: #0070f3; }
      .hero-mesh { opacity: 0.12; }
    </style>
    <radialGradient id="meshGrad" cx="20%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#50e3c2" />
      <stop offset="35%" stop-color="#007cf0" />
      <stop offset="70%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#eb367f" />
    </radialGradient>
  </defs>

  <!-- Background sheet -->
  <rect width="1200" height="360" class="bg" />
  
  <!-- Subtle ambient bloom behind logo area -->
  <circle cx="160" cy="180" r="220" fill="url(#meshGrad)" class="hero-mesh" />

  <!-- Outer Hairline Frame -->
  <rect x="16" y="16" width="1168" height="328" rx="12" class="border" />

  <!-- Brand Mark (Squircle + Vault Geometry) -->
  <g transform="translate(64, 116)">
    <!-- Dark Badge Squircle -->
    <rect x="0" y="0" width="128" height="128" rx="28" fill="#0f0f0f" />
    <!-- Outer Rounded Frame -->
    <rect x="24" y="24" width="80" height="80" rx="14" fill="none" stroke="#ffffff" stroke-width="9" stroke-linejoin="round" />
    <!-- Horizontal Crossbar -->
    <line x1="24" y1="49" x2="104" y2="49" stroke="#ffffff" stroke-width="9" stroke-linecap="square" />
    <!-- Downward Lock Chevron -->
    <polyline points="32,58 64,78 96,58" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Wordmark and Typography -->
  <g transform="translate(224, 150)">
    <text x="0" y="10" class="title">TRANCHELOCK</text>
    <text x="0" y="44" class="subtitle">Milestone-Gated Capital Release for Autonomous AI Agents on Solana</text>
  </g>

  <!-- Technical Pill Badges -->
  <g transform="translate(224, 230)">
    <!-- Badge 1: Devnet -->
    <g transform="translate(0, 0)">
      <rect width="150" height="28" class="badge-bg" />
      <circle cx="16" cy="14" r="4" class="badge-dot" />
      <text x="28" y="18" class="badge-text">SOLANA DEVNET</text>
    </g>
    <!-- Badge 2: Ed25519 Introspection -->
    <g transform="translate(162, 0)">
      <rect width="216" height="28" class="badge-bg" />
      <circle cx="16" cy="14" r="4" class="badge-blue" />
      <text x="28" y="18" class="badge-text">ED25519 INTROSPECTION</text>
    </g>
    <!-- Badge 3: 22 Invariants -->
    <g transform="translate(390, 0)">
      <rect width="196" height="28" class="badge-bg" />
      <circle cx="16" cy="14" r="4" class="badge-dot" />
      <text x="28" y="18" class="badge-text">22/22 INVARIANTS PASS</text>
    </g>
    <!-- Badge 4: Test Oracle -->
    <g transform="translate(598, 0)">
      <rect width="190" height="28" class="badge-bg" />
      <circle cx="16" cy="14" r="4" class="badge-blue" />
      <text x="28" y="18" class="badge-text">VERIFIER ORACLE (153B)</text>
    </g>
  </g>
</svg>
